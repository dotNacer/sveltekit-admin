name: Manual npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already present in package.json to publish
        required: true
        default: 0.7.0
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      # Pas de `registry-url` ici, volontairement. Il fait écrire à setup-node un
      # `.npmrc` contenant `_authToken=${NODE_AUTH_TOKEN}`, et sans secret il y
      # laisse son placeholder littéral `XXXXX-XXXXX-XXXXX-XXXXX`. npm voit
      # alors un jeton configuré et s'en sert au lieu de faire l'échange OIDC du
      # Trusted Publishing — d'où un `404 PUT /sveltekit-admin` (npm renvoie 404
      # et pas 403 pour ne pas révéler l'existence du package). Sans `.npmrc`,
      # npm n'a aucun jeton et bascule sur l'OIDC, qui est justement le but.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Épinglé sur la majeure 11, PAS `@latest`. npm 12.0.0 a changé le format
      # de `npm view --json` (il retourne désormais toujours un tableau), et
      # `@changesets/cli@3.0.1` — la dernière publiée — en ressort avec un
      # `info.versions` undefined, donc un `TypeError: Cannot read properties of
      # undefined (reading 'includes')` dans `getUnpublishedPackages`. La release
      # 0.8.1 a cassé exactement là-dessus. `@latest` dans un chemin de
      # publication signifie qu'une majeure d'outil tierce peut casser une
      # release sans qu'une seule ligne n'ait bougé ici. Connu bon : 11.19.1.
      # À relever quand changesets gère npm 12.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: npm run package

      - name: Verify package version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Publish package with npm Trusted Publishing
        run: npm publish --provenance --access public

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
