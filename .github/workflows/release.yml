name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm Trusted Publishing: lets this job request a
      # short-lived OIDC token that npm exchanges for publish rights, so no
      # NPM_TOKEN secret is needed at all. Must also be configured as a
      # Trusted Publisher on the package's npm settings page (org/repo/
      # workflow filename must match exactly).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; Node 22's bundled npm isn't
      # guaranteed to meet that, so upgrade explicitly rather than relying on
      # whatever setup-node happens to ship.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Diagnose npm trusted publishing
        run: |
          set -eu
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Registry: $(npm config get registry)"
          echo "OIDC request URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          echo "OIDC request token present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo yes || echo no)"
          npm ping --registry=https://registry.npmjs.org
          npm view sveltekit-admin version --registry=https://registry.npmjs.org

      - name: Create release PR or publish to npm
        # v1 detects what got published by regex-matching "New tag: pkg@x.y.z"
        # in the publish command's stdout — a format @changesets/cli 3.0.0 no
        # longer prints (it switched to a prettified "Successfully published"/
        # "Created git tags." output). With v1, that match silently finds
        # nothing, so the npm publish succeeds but the action pushes no tag
        # and creates no GitHub Release. v2 reads @changesets/cli 3.x's
        # structured CHANGESETS_OUTPUT event stream instead and is the version
        # actually meant to pair with cli@3 — hence the renamed *-script inputs.
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
