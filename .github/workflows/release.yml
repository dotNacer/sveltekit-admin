name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm Trusted Publishing: lets this job request a
      # short-lived OIDC token that npm exchanges for publish rights, so no
      # NPM_TOKEN secret is needed at all. Must also be configured as a
      # Trusted Publisher on the package's npm settings page (org/repo/
      # workflow filename must match exactly).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1; Node 22's bundled npm isn't
      # guaranteed to meet that, so upgrade explicitly rather than relying on
      # whatever setup-node happens to ship.
      - run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - run: bun install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
