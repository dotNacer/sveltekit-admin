name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm Trusted Publishing: lets this job request a
      # short-lived OIDC token that npm exchanges for publish rights, so no
      # NPM_TOKEN secret is needed at all. Must also be configured as a
      # Trusted Publisher on the package's npm settings page (org/repo/
      # workflow filename must match exactly).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      # Pas de `registry-url` ici, volontairement. Il fait écrire à setup-node un
      # `.npmrc` contenant `_authToken=${NODE_AUTH_TOKEN}`, et sans secret il y
      # laisse son placeholder littéral `XXXXX-XXXXX-XXXXX-XXXXX`. npm voit
      # alors un jeton configuré et s'en sert au lieu de faire l'échange OIDC du
      # Trusted Publishing — d'où un `404 PUT /sveltekit-admin` (npm renvoie 404
      # et pas 403 pour ne pas révéler l'existence du package). Sans `.npmrc`,
      # npm n'a aucun jeton et bascule sur l'OIDC, qui est justement le but.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; Node 22's bundled npm isn't
      # guaranteed to meet that, so upgrade explicitly rather than relying on
      # whatever setup-node happens to ship.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Diagnose npm trusted publishing
        run: |
          set -eu
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Registry: $(npm config get registry)"
          echo "OIDC request URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          echo "OIDC request token present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo yes || echo no)"
          npm ping --registry=https://registry.npmjs.org
          npm view sveltekit-admin version --registry=https://registry.npmjs.org

      - name: Create release PR or publish to npm
        # v1 detects what got published by regex-matching "New tag: pkg@x.y.z"
        # in the publish command's stdout — a format @changesets/cli 3.0.0 no
        # longer prints (it switched to a prettified "Successfully published"/
        # "Created git tags." output). With v1, that match silently finds
        # nothing, so the npm publish succeeds but the action pushes no tag
        # and creates no GitHub Release. v2 reads @changesets/cli 3.x's
        # structured CHANGESETS_OUTPUT event stream instead and is the version
        # actually meant to pair with cli@3 — hence the renamed *-script inputs.
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # `pnpm run release` (= `pnpm run package && changeset publish`) and
          # NOT `npm run package && npm publish`. Two reasons, both load-bearing:
          #
          # 1. The action does not run this through a shell — it invokes the
          #    binary with the rest as ARGV. `npm run` appends extra args to the
          #    script, escaped, so the `&&` arrived as a literal argument to
          #    `svelte-package`, which ignored it. `npm publish` never ran, and
          #    since `svelte-package` exits 0 the job went green while
          #    publishing nothing (0.7.0 and 0.8.0 were both versioned, tagged
          #    nowhere, and never reached npm).
          # 2. `changesets/action@v2` learns what was published by reading the
          #    CHANGESETS_OUTPUT ndjson stream that only `changeset publish`
          #    emits. A bare `npm publish` emits none, so the action created no
          #    git tag and no GitHub Release even when a publish did happen.
          #
          # Provenance moves to `publishConfig.provenance` in package.json,
          # since `changeset publish` takes no `--provenance` flag.
          publish-script: pnpm run release
          version-script: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
