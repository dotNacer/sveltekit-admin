name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep 20: Prisma tests still run there. better-sqlite3 is pinned to
        # exactly 12.9.0 in package.json — 12.10.0+ and 13.x dropped Node 20
        # prebuilt binaries, which forces a source rebuild via node-gyp@latest
        # that crashes on Node 20 (`webidl.util.markAsUncloneable is not a
        # function`). Bumping this dependency requires re-checking that a
        # Node 20 prebuild still exists for the target version.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # Pinned on purpose: an unpinned setup-pnpm floats to whatever pnpm release is
      # current, so CI behaviour could change without a commit. 10.25.0 is the version
      # this branch was developed and verified against.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Prisma client used by tests/integration/handler.db.test.ts is generated
      # into tests/fixtures/prisma/client/, which is gitignored. `check` type-checks
      # that import, so the client must exist before `check` runs — otherwise
      # svelte-check reports "Cannot find module '../fixtures/prisma/client/index.js'".
      # Generating it explicitly here keeps every step below independent of any other
      # step's side effects (`check` and the test scripts each run `svelte-kit sync`
      # themselves, and the test scripts re-run `test:gen` idempotently).
      - run: pnpm run test:gen
      - run: pnpm run check
      # `no-explicit-any` is a warning on purpose (see eslint.config.js), so this step
      # fails only on errors. The script runs `svelte-kit sync` itself: the type-aware
      # rule needs tsconfig.json's generated base config.
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run package

  # Éprouve le PAQUET, pas les sources : `example/` consomme la bibliothèque via
  # le workspace, donc rien ici ne vérifiait que le tarball publié — son
  # contenu, sa carte `exports`, ses peerDependencies — fonctionne dans une
  # application tierce. Le script empaquette, installe dans une copie de
  # `example/` posée hors du workspace, construit avec Vite, démarre le serveur
  # et l'interroge en HTTP.
  #
  # Node 22 seulement : ce job valide la forme du paquet, pas la compatibilité
  # entre versions de Node, que la matrice `test` couvre déjà.
  #
  # L'installation du consommateur se fait sans lockfile, volontairement : la
  # question posée est « une installation neuve, aujourd'hui, fonctionne-t-elle
  # avec ce paquet ». Un lockfile figé y répondrait pour hier.
  packaged-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke:packaged

  changeset-check:
    # Only meaningful on PRs: a push to main is often the merge of a
    # "Version Packages" PR, which legitimately consumes changesets rather
    # than adding one. Same reasoning excludes the "Version Packages" PR
    # itself (opened by changesets/action from changeset-release/main) —
    # it deletes the consumed changesets and bumps versions, so it will
    # never have a new changeset of its own.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if src/ (or any published file) changed since main without a
      # matching .changeset/*.md — catches changes that landed without one,
      # regardless of who wrote them. The extra echo on failure is aimed at
      # an AI agent picking up this PR: it has no reason to already know
      # about .claude/skills/writing-changesets/SKILL.md, so the failure
      # itself points there instead of relying on the agent stumbling onto it.
      - run: |
          pnpm exec changeset status --since=origin/main || {
            echo "::error::No changeset found for this change. If you are an AI agent: read .claude/skills/writing-changesets/SKILL.md in this repo before adding one — it explains how to pick the bump type (patch/minor/major) and write the entry. Then add a .changeset/*.md file and push it to this branch."
            exit 1
          }
      # `changeset status` only proves a changeset exists. This proves it is
      # readable: tag present and matching the bump, one paragraph, under the
      # length cap. Without it the skill is advisory and the verbosity returns
      # on the first PR.
      - run: pnpm run lint:changesets
